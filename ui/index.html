<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HouseMate</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="auth-shell">
      <div class="brand-head">
        <p class="eyebrow">Household coordination</p>
        <h1>HouseMate</h1>
      </div>

      <div class="flash" hidden></div>

      <div class="auth-tabs">
        <button type="button" id="tab-login" class="active">Login</button>
        <button type="button" id="tab-register">Register</button>
      </div>

      <form class="auth-form" id="auth-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <div class="form-actions">
          <button class="button button-primary" type="submit" id="submit-btn">Login</button>
        </div>
      </form>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
      // If already logged in, skip straight to the app.
      if (getToken()) location.href = "tasks.html";

      let mode = "login"; // or "register"
      const tabLogin = document.getElementById("tab-login");
      const tabRegister = document.getElementById("tab-register");
      const submitBtn = document.getElementById("submit-btn");
      const pwInput = document.getElementById("password");

      function setMode(next) {
        mode = next;
        tabLogin.classList.toggle("active", mode === "login");
        tabRegister.classList.toggle("active", mode === "register");
        submitBtn.textContent = mode === "login" ? "Login" : "Register";
        pwInput.autocomplete = mode === "login" ? "current-password" : "new-password";
        clearFlash();
      }

      tabLogin.addEventListener("click", () => setMode("login"));
      tabRegister.addEventListener("click", () => setMode("register"));

      document.getElementById("auth-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        clearFlash();
        const username = document.getElementById("username").value.trim();
        const password = pwInput.value;
        const path = mode === "login" ? "/login" : "/register";
        try {
          const data = await household(path, {
            method: "POST",
            body: JSON.stringify({ username, password }),
          });
          saveSession(data.token, data.user);
          location.href = "tasks.html";
        } catch (err) {
          flashError(err);
        }
      });
    </script>
  </body>
</html>
