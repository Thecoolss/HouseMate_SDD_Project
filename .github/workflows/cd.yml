name: CD

on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never interrupt a migration/deploy with a newer deployment.
    concurrency:
      group: housemate-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --version 1.3.0b6 --yes
      - name: Deploy services, check health, and publish UI
        env:
          PREFIX: ${{ vars.PREFIX }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          UI_STORAGE: ${{ vars.UI_STORAGE }}
          HOUSEHOLD_DATABASE_URL: ${{ secrets.HOUSEHOLD_DATABASE_URL }}
          FAIRNESS_DATABASE_URL: ${{ secrets.FAIRNESS_DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: bash scripts/azure/deploy.sh
