# Lint rules for both services and the integration tests (CI runs `ruff check` from the
# repo root). Kept to correctness checks: pyflakes (F) plus the basic pycodestyle errors
# that indicate real mistakes (E4 imports, E7 statements, E9 syntax). Style-only rules
# such as line length are deliberately not enforced.
target-version = "py312"
extend-exclude = ["venv", ".venv", "data"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Each blueprint package ends its __init__.py with "from app.x import routes" so the routes
# register on the blueprint. That import is deliberately late (it needs `bp` defined first)
# and deliberately unused by name, which is the standard Flask blueprint pattern.
"**/__init__.py" = ["E402", "F401"]
